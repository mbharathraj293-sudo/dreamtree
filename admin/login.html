<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | The Dreaming Tree Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <span class="auth-logo">🌳</span>
      <h1 class="auth-title">The Dreaming Tree</h1>
      <p class="auth-subtitle">Manager Console Sign In</p>

      <div class="error-message" id="error-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="admin@thedreamingtree.in">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>

      <div class="auth-links">
        <a href="forgot-password.html">Forgot password?</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { adminApi } from './assets/js/admin-api.js';

    // Clear existing tokens on load to reset state
    localStorage.removeItem('admin_token');

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const data = await adminApi.login(email, password);
        if (data.requiresOTP) {
          window.location.href = `otp.html?userId=${data.userId}`;
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        errorBox.innerText = err.message;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
